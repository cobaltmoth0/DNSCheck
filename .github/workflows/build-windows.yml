name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'app.manifest'
      - 'app.rc'
      - 'rsrc_windows_amd64.syso'
      - 'assets/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile Windows resources
        shell: bash
        run: windres -O coff -i app.rc -o rsrc_windows_amd64.syso

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows AMD64 executable
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o DNSCheck-windows-amd64.exe .

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\DNSCheck-windows-amd64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DNSCheck-windows-amd64.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload executable and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DNSCheck-windows-amd64
          path: |
            DNSCheck-windows-amd64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
